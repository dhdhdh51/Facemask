name: Android

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is required" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python -m json.tool app/google-services.json >/dev/null

      - name: Validate API URL
        run: |
          if [ -z "$API_BASE_URL" ] || [[ "$API_BASE_URL" != https://* ]]; then
            echo "Set repository variable or secret API_BASE_URL to an HTTPS endpoint" >&2
            exit 1
          fi

      - name: Configure optional release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          values=("$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do [ -n "$value" ] && present=$((present + 1)); done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "Provide all four release-signing secrets or none of them" >&2
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=$RELEASE_KEY_PASSWORD"
            } > signing.properties
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint, and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PAPI_BASE_URL="$API_BASE_URL" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" -PBUILD_NUMBER="$BUILD_NUMBER"

      - name: Build signed release bundle
        if: env.SIGNED_RELEASE == 'true'
        run: ./gradlew --no-daemon bundleRelease -PAPI_BASE_URL="$API_BASE_URL" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" -PBUILD_NUMBER="$BUILD_NUMBER"

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jawlinefit-android-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/reports/tests/**
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/reports/lint-results-debug.xml
