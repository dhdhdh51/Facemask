name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
      PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      TERMS_URL: ${{ vars.TERMS_URL }}
      ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate build variables
        run: |
          for name in API_BASE_URL PRIVACY_URL TERMS_URL ACCOUNT_DELETION_URL; do
            value="${!name}"
            if [ -z "$value" ] || [[ "$value" != https://* ]]; then
              echo "$name must be configured as an HTTPS repository variable or secret" >&2
              exit 1
            fi
          done

      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 is required" >&2; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python -m json.tool app/google-services.json >/dev/null

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do [ -n "$value" ] && present=$((present + 1)); done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "Provide all four signing secrets or none" >&2
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > signing.properties
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint, and debug build
        run: >-
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          -PAPI_BASE_URL="$API_BASE_URL"
          -PPRIVACY_URL="$PRIVACY_URL"
          -PTERMS_URL="$TERMS_URL"
          -PACCOUNT_DELETION_URL="$ACCOUNT_DELETION_URL"
          -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          -PBUILD_NUMBER="$BUILD_NUMBER"

      - name: Build signed release AAB and APK
        if: env.SIGNED_RELEASE == 'true'
        run: >-
          ./gradlew --no-daemon bundleRelease assembleRelease
          -PAPI_BASE_URL="$API_BASE_URL"
          -PPRIVACY_URL="$PRIVACY_URL"
          -PTERMS_URL="$TERMS_URL"
          -PACCOUNT_DELETION_URL="$ACCOUNT_DELETION_URL"
          -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          -PBUILD_NUMBER="$BUILD_NUMBER"

      - name: Remove reconstructed secrets
        if: always()
        run: rm -f app/google-services.json release.jks signing.properties

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jawlinefit-android-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/reports/tests/**
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/reports/lint-results-debug.xml
